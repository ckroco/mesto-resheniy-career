<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Примерь новую профессию | Место решений</title>
<style>
:root{color-scheme:light;--ink:#173f3b;--muted:#42665f;--cream:#fcfaf4;--mint:#e0f3ed;--teal:#087368;--line:#aacac0}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:linear-gradient(137deg,#d6efed 0%,#fcfaf4 51%,#f5e6c8 100%);color:var(--ink);font:16px/1.5 "Open Sans",system-ui,sans-serif}
main{max-width:810px;margin:auto;padding:24px 18px 50px}
header{display:flex;align-items:center;gap:13px;margin:0 0 18px;font-weight:750}
header img{width:52px;height:52px;border-radius:50%}
#game{background:#fffefa;border-radius:26px;padding:clamp(18px,5vw,42px);box-shadow:0 12px 36px #173f3b15;min-width:0}
h2,h3{font-family:Georgia,serif;line-height:1.15}
h2{font-size:clamp(1.95rem,6vw,3.25rem);margin:0 0 16px}
h3{font-size:1.4rem;margin:0 0 10px}
p{margin:.6em 0 1.1em}
.intro{max-width:55ch;font-size:1.15rem}
fieldset{padding:0;border:0;min-width:0;margin:0 0 24px}
legend,fieldset strong{font-weight:750}
legend{margin-bottom:6px}
label{display:block}
select,input[type=number]{width:100%;font:inherit;color:inherit;background:#f5fbf8;border:1px solid var(--line);border-radius:12px;padding:10px;min-height:48px}
input[type=checkbox],input[type=radio]{flex:0 0 auto;accent-color:var(--teal);width:18px;height:18px;margin:3px 0 0}
.choice{display:flex;gap:10px;align-items:flex-start;padding:12px;border-radius:12px;background:#f1f7f4;cursor:pointer}
.choice:hover{background:#e7f3ed}
.choice:has(input:checked){background:#c9ece0;box-shadow:inset 3px 0 var(--teal)}
.choice-grid,.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.fields label{font-size:.94rem}.fields input{margin-top:5px}
.hint,.group-hint,.progress{color:var(--muted);font-size:.94rem}
.progress{font-weight:750;margin:0 0 12px}
.progress progress{width:100%;height:8px;display:block;accent-color:var(--teal);margin-top:7px}
.buttons{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
button,.download-link,.consultation-link{display:inline-block;font:inherit;font-weight:750;min-height:48px;padding:10px 17px;border:1px solid transparent;border-radius:14px;background:var(--teal);color:#fff;cursor:pointer;text-decoration:none}
button:hover,.download-link:hover,.consultation-link:hover{background:#075c54}
button.secondary{background:#f4f7f3;color:var(--ink);border-color:var(--line)}
button.secondary:hover{background:#e6f1ea}
:focus-visible{outline:3px solid #a24a21;outline-offset:3px}
.error{color:#a02d28;font-weight:700}
table{width:100%;border-collapse:collapse;table-layout:fixed;margin:12px 0}
th,td{text-align:left;vertical-align:top;padding:9px 6px;border-bottom:1px solid #c9ded4;overflow-wrap:anywhere}
thead{background:var(--mint)}
.result,details{background:#e9f4ee;border-radius:16px;padding:16px;margin:17px 0}
.result p:last-child{margin-bottom:0}
.consultation{margin:22px 0;padding:16px;border:1px solid var(--line);border-radius:16px;background:#f5fbf8}
.consultation .hint{margin:8px 0 0}
summary{cursor:pointer;font-weight:750}
.download-preview{display:block;max-width:100%;height:auto;border-radius:12px;margin:12px 0}
@media(max-width:520px){.choice-grid,.fields{grid-template-columns:1fr}th,td{font-size:.85rem}main{padding-inline:12px}}
</style>
</head>

function layoutResultCard(ctx) {

  const labelFont = 'bold 31px Arial, sans-serif';

    y = text(title, left, y + 31, width, sectionFont, 49) + 15;
    drawContent();
    y += 24;
    fill.height = y - top;
    y += 26;
  }

  y = text('Моя карта перемен', left, y, width, titleFont, 74) + 24;
  section(priorities[priority][0], () => {
    if (role) {
      y = text('Хочу попробовать', left, y, width, labelFont, 42);
      y = text(activities[role][1], left, y, width, bodyFont, 45) + 16;
    }
    y = text('Первый шаг', left, y, width, labelFont, 42);
    y = text(firstStep(), left, y, width, bodyFont, 46);
  });

  section('Сейчас / Хочу', () => {
    const right = left + column + gutter;
    const heading = y;
    y = text('Сейчас', left, heading, column, labelFont, 43);
    text('Хочу', right, heading, column, labelFont, 43);
    for (const [title, current, future] of comparisonRows()) {
      blocks.push({x: left, top: y + 3, width, height: 2});
      const row = text(title, left, y + 18, width, labelFont, 43);
      const bottom = [current, future].map((items, index) =>
        items.reduce((top, item) => text(item, index ? right : left, top, column, comparisonFont, 42) + 8, row));
      y = Math.max(...bottom) + 6;
    }
  });

  section('Условия по деньгам', () => {
    const amounts = [['Текущий доход', money.current], ['Нужный минимум', money.floor]];
    for (const [label, amount] of amounts) {
      if (amount !== '') y = text(`${label} · ${fmt.format(Number(amount))} ₽ в месяц на руки`, left, y, width, bodyFont, 46);
    }
    y = text(payResult(), left, y + 10, width, bodyFont, 46);
  });

  const day = daySummary();
  if (day) {
    section(day.title, () => {
      y = text(day.note, left, y, width, bodyFont, 46);
      for (const task of day.tasks) {
        y += 10;
        text('•', left, y, 25, bodyFont, 46);
        y = text(task, left + 36, y, width - 36, bodyFont, 46);
      }
    });
  }
  if (selectedSkills.length) {
    section('Что возьму с собой', () => {
      y = text(selectedSkills.map(id => skills[id]).join(' · '), left, y, width, bodyFont, 46);
    });
  }
  return {height: y + 24, blocks};
}

function downloadCard() {
  const output = game.querySelector('#download-result');
  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d');
  if (!ctx) {
    output.textContent = 'В этом браузере не удалось создать изображение. Можно сохранить снимок экрана.';
    return;
  }

  const layout = layoutResultCard(ctx);
  canvas.width = 1080;
  canvas.height = layout.height;
  const background = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
  background.addColorStop(0, '#d5efea');
  background.addColorStop(0.5, '#fcfaf4');
  background.addColorStop(1, '#f7e9ca');
  ctx.fillStyle = background;
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  const logo = document.getElementById('brand-logo');
  if (logo.complete && logo.naturalWidth) {
    ctx.save();
    ctx.beginPath();
    ctx.arc(115, 96, 43, 0, 2 * Math.PI);
    ctx.clip();
    ctx.drawImage(logo, 72, 53, 86, 86);
    ctx.restore();
  }
  ctx.fillStyle = '#173f3b';
  ctx.font = 'bold 33px sans-serif';
  ctx.fillText('Место решений', 182, 107);
  ctx.textBaseline = 'top';
  for (const block of layout.blocks) {
    if (block.line) {
      ctx.fillStyle = '#173f3b';
      ctx.font = block.font;
      ctx.fillText(block.line, block.x, block.top);
    } else {
      ctx.fillStyle = block.height === 2 ? '#c9ded4' : '#e9f4ee';
      ctx.beginPath();
      if (ctx.roundRect && block.height > 2) ctx.roundRect(block.x, block.top, block.width, block.height, 26);
      else ctx.rect(block.x, block.top, block.width, block.height);
      ctx.fill();
    }
  }
  try {
    const url = canvas.toDataURL('image/png');
    const link = document.createElement('a');
    link.className = 'download-link';
    link.href = url;
    link.download = 'polnaya_karta_peremen.png';
    link.textContent = 'Сохранить PNG';
    if (!url.startsWith('data:image/png')) throw new Error('PNG unavailable');
    const preview = document.createElement('img');
    preview.className = 'download-preview';
    preview.src = url;
    preview.alt = 'Карта перемен для скачивания';
    const details = document.createElement('details');
    const summary = document.createElement('summary');
    summary.textContent = 'Предпросмотр полной карты';
    details.append(summary, preview);
    output.replaceChildren(link, details);
    link.click();
  } catch {
    output.textContent = 'Сохранить PNG не удалось. Можно сделать снимок экрана с результатом.';
  }
}
restore();
render();
</script>
